<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Adsgram Reward</title>
        <link rel='stylesheet' href='css/styles.css'>
        <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    </head>
    
    <body>
        <div class="loader" id="loader">
            <div class="card">
                <div class="spinner"></div>
                <div class="title">Loading ad...</div>
                <div class="text">Please wait a moment</div>
            </div>
        </div>
        
        <script>
            function postEvent(handlerName, eventName, eventData = {}) {
                const handler = window.webkit?.messageHandlers?.[handlerName];
                if (!handler) return;
                
                handler.postMessage({
                    eventName,
                    eventData
                });
            }
            
            function postNicegramEvent(eventName, eventData = {}) {
                postEvent("nicegram", eventName, eventData);
            }
            
            function postTelegramEvent(eventName, eventData = {}) {
                postEvent("performAction", eventName, eventData);
            }
            
            function closeWebApp() {
                postTelegramEvent("web_app_close");
            }
            
            const AdController = window.Adsgram.init({ blockId: "22393" });
            
            AdController.show()
                .then((result) => {
                    postNicegramEvent("rewardResult", result);
                })
                .catch((result) => {
                    postNicegramEvent("rewardError");
                })
                .finally(() => {
                    closeWebApp();
                });
        </script>  
    </body>
</html>
